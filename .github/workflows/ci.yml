name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 24.x is the minimum version documented in the README, and is the current LTS.
        # 26.x becomes LTS in October 2026 and is tested so upgrades are caught early.
        node-version: [24.x, 26.x]

    defaults:
      run:
        working-directory: example-server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: example-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The tests start app.js as a process, so they cover parsing as well as behaviour.
      - name: Test
        run: npm test
